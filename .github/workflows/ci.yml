name: ghost-seal

# Two jobs, and they are the whole governance story:
#   guard    — the seal artwork cannot change without a visible, approved diff
#   selftest — the seal still behaves identically on this runtime
# Make both required checks on `main`, with CODEOWNERS on seal_master.png so a
# brand + legal approval is needed to change the standard.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly drift check: catches a base-image change

jobs:
  guard:
    name: mask hash guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: seal_master.png must match every pinned hash
        run: |
          PINNED=6a6089230d3904f1c4357314102e47fe30b54c1ee386324530664d84c7f511e2
          ACTUAL=$(sha256sum seal_master.png | cut -d' ' -f1)
          echo "pinned: $PINNED"
          echo "actual: $ACTUAL"
          test "$ACTUAL" = "$PINNED" || {
            echo "::error::seal_master.png changed. This is a HOUSE STANDARD change:"
            echo "::error::re-pin the hash in seal_master.json, SKILL.md, doc/, this workflow,"
            echo "::error::get brand + legal sign-off, then re-seal the library with --force."
            exit 1; }
          grep -q "$PINNED" seal_master.json || { echo "::error::seal_master.json not re-pinned"; exit 1; }
          grep -q "$PINNED" doc/ghost-seal-spec.md || { echo "::error::spec doc not re-pinned"; exit 1; }

  selftest:
    name: determinism & non-destructiveness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the pinned runtime from this repo's Dockerfile, so CI exercises the
      # exact image every other lane runs. Its build already runs the selftest.
      - name: build pinned runtime
        run: docker build -t ghost-seal:ci .
      - name: harness
        run: docker run --rm ghost-seal:ci selftest
      - name: reference asset is byte-stable
        run: |
          docker run --rm -v "$PWD":/w ghost-seal:ci apply /w/tests/reference.png -o /w/a.png
          docker run --rm -v "$PWD":/w ghost-seal:ci apply /w/tests/reference.png -o /w/b.png --force
          docker run --rm -v "$PWD":/w --entrypoint python3 ghost-seal:ci -c "
          import numpy as np
          from PIL import Image
          a = np.asarray(Image.open('/w/a.png').convert('RGB'))
          b = np.asarray(Image.open('/w/b.png').convert('RGB'))
          assert np.array_equal(a, b), 'seal is not deterministic on this runtime'
          print('deterministic OK')"
      - name: publish gate works
        run: |
          mkdir -p gate && cp tests/reference.png gate/unsealed.png
          if docker run --rm -v "$PWD":/w --entrypoint python3 ghost-seal:ci verify_tree.py /w/gate; then
            echo "::error::verify_tree passed an unsealed image"; exit 1
          fi
          echo "gate correctly rejects unsealed imagery"
